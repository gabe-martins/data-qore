name: ${COMPOSE_PROJECT_NAME:-dataqore}

x-engine-environment: &engine-environment
  DATAQORE_ENV_FILE: /dev/null
  DATABASE_URL: postgresql+psycopg://srv_dataqore_engine:${ENGINE_DB_PASSWORD:?Run ./docker.sh setup}@postgres:5432/dataqore_engine?sslmode=disable
  ENGINE_API_KEY: ${ENGINE_API_KEY:?Run ./docker.sh setup}
  CONNECTIONS_ENCRYPTION_KEY: ${CONNECTIONS_ENCRYPTION_KEY:?Run ./docker.sh setup}
  CONNECTIONS_ENCRYPTION_KEY_VERSION: v1
  EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:?Run ./docker.sh setup}
  SQLITE_ALLOWED_ROOT: /sources

services:
  postgres:
    <<: *service
    image: reg.mini.dev/postgres:16.15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./docker.sh setup}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run ./docker.sh setup}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:?Run ./docker.sh setup}
      APP_MIGRATION_PASSWORD: ${APP_MIGRATION_PASSWORD:?Run ./docker.sh setup}
      ENGINE_MIGRATION_PASSWORD: ${ENGINE_MIGRATION_PASSWORD:?Run ./docker.sh setup}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-dataqore.sh:ro
      - ./database/00_databases_and_roles.sql:/dataqore/database/00_databases_and_roles.sql:ro
      - ./database/05_migration_roles.sql:/dataqore/database/05_migration_roles.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    <<: *service
    restart: "no"
    build: { context: ., target: migrate }
    environment:
      IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY:?Configure the original identity encryption key}
      CONNECTIONS_ENCRYPTION_KEY: ${CONNECTIONS_ENCRYPTION_KEY:?Configure the original connection encryption key}
      APP_MIGRATION_DATABASE_URL: postgresql://srv_dataqore_app_migrator:${APP_MIGRATION_PASSWORD:?Run ./docker.sh setup}@postgres:5432/dataqore_app?schema=app&sslmode=disable
      ENGINE_MIGRATION_DATABASE_URL: postgresql+psycopg://srv_dataqore_engine_migrator:${ENGINE_MIGRATION_PASSWORD:?Run ./docker.sh setup}@postgres:5432/dataqore_engine?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  engine:
    <<: *service
    image: ${COMPOSE_PROJECT_NAME:-dataqore}-engine:local
    build: { context: ., target: engine }
    environment: *engine-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  worker:
    <<: *service
    image: ${COMPOSE_PROJECT_NAME:-dataqore}-engine:local
    build: { context: ., target: engine }
    command: [-m, dataqore_engine, worker]
    environment: *engine-environment
    stop_grace_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /opt/venv/bin/python, /app/docker/worker-health.py]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  controller:
    <<: *service
    build: { context: ., target: controller }
    environment:
      DATAQORE_ENV_FILE: /dev/null
      CONTROLLER_HOST: 0.0.0.0
      DATABASE_URL: postgresql://srv_dataqore_app:${APP_DB_PASSWORD:?Run ./docker.sh setup}@postgres:5432/dataqore_app?schema=app&sslmode=disable
      ENGINE_API_URL: http://engine:8000
      ENGINE_API_KEY: ${ENGINE_API_KEY:?Run ./docker.sh setup}
      IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY:?Configure the original identity encryption key}
      JWT_SECRET: ${JWT_SECRET:?Run ./docker.sh setup}
      WEB_ORIGIN: ${WEB_ORIGIN:?Run ./docker.sh setup}
    depends_on:
      migrate: { condition: service_completed_successfully }
      engine: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  web:
    <<: *service
    build: { context: ., target: web }
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    depends_on:
      controller: { condition: service_healthy }
      worker: { condition: service_healthy }

volumes:
  postgres-data:
