name: ${COMPOSE_PROJECT_NAME:-dataqore}

# Configure the container timezone here. Database storage remains UTC.
x-timezone: &timezone America/Sao_Paulo

x-service: &service
  platform: linux/amd64
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-engine-environment: &engine-environment
  TZ: *timezone
  DATAQORE_ENV_FILE: /config/engine.env
  SQLITE_ALLOWED_ROOT: /sources

services:
  bootstrap:
    <<: *service
    restart: "no"
    build: { context: ., target: bootstrap }
    network_mode: none
    # Optional import for installations created by the old setup command.
    env_file:
      - path: .env.docker
        required: false
    environment:
      TZ: *timezone
    volumes:
      - bootstrap-data:/state
      - postgres-data:/database:ro
      - postgres-config:/exports/postgres
      - controller-config:/exports/controller
      - engine-config:/exports/engine
      - migration-config:/exports/migrate

  postgres:
    <<: *service
    image: postgres:16-bookworm
    environment:
      TZ: *timezone
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /config/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-config:/config:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-dataqore.sh:ro
      - ./database/00_databases_and_roles.sql:/dataqore/database/00_databases_and_roles.sql:ro
      - ./database/05_migration_roles.sql:/dataqore/database/05_migration_roles.sql:ro
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    <<: *service
    restart: "no"
    build: { context: ., target: migrate }
    environment:
      TZ: *timezone
      DATAQORE_ENV_FILE: /config/migrate.env
    volumes:
      - migration-config:/config:ro
    depends_on:
      postgres: { condition: service_healthy }

  engine:
    <<: *service
    image: ${COMPOSE_PROJECT_NAME:-dataqore}-engine:local
    pull_policy: build
    build: { context: ., target: engine }
    environment: *engine-environment
    volumes:
      - engine-config:/config:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  worker:
    <<: *service
    image: ${COMPOSE_PROJECT_NAME:-dataqore}-engine:local
    pull_policy: build
    build: { context: ., target: engine }
    command: [-m, dataqore_engine, worker]
    environment: *engine-environment
    volumes:
      - engine-config:/config:ro
    stop_grace_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /opt/venv/bin/python, /app/docker/worker-health.py]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  controller:
    <<: *service
    build: { context: ., target: controller }
    environment:
      TZ: *timezone
      DATAQORE_ENV_FILE: /config/controller.env
      CONTROLLER_HOST: 0.0.0.0
      ENGINE_API_URL: http://engine:8000
      # Set this to the exact URL used by browsers on your network.
      WEB_ORIGIN: ${DATAQORE_WEB_ORIGIN:-http://192.168.15.9:8080}
    volumes:
      - controller-config:/config:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      engine: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  web:
    <<: *service
    build: { context: ., target: web }
    environment:
      TZ: *timezone
    ports:
      - "${DATAQORE_BIND_ADDRESS:-0.0.0.0}:${DATAQORE_PORT:-8080}:8080"
    depends_on:
      controller: { condition: service_healthy }
      worker: { condition: service_healthy }

volumes:
  postgres-data:
  bootstrap-data:
  postgres-config:
  controller-config:
  engine-config:
  migration-config:
